
name: Cloud Computing CI/CD

on:
  push:
    branches:
      - bonus-3-ci-cd

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Recuperer le projet depuis GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Creer les variables d'environnement
      - name: Configure environment variables
        run: |
          cat > .env << 'EOF'
          MONGO_ROOT_USERNAME=admin
          MONGO_ROOT_PASSWORD=ci-password-123
          MONGO_CATALOGUE_DB=catalogue_db
          MONGO_COMMANDES_DB=commandes_db
          MONGO_NOTIFICATIONS_DB=notifications_db
          EOF

      # 4. Verifier la configuration Docker Compose
      - name: Validate Docker Compose
        run: docker compose config

      # 5. Construire et demarrer les conteneurs
      - name: Build and start containers
        run: docker compose up -d --build

      # 6. Executer les tests automatiques
      - name: Run automatic tests
        run: python tests/smoke_test.py

      # 7. Afficher les logs
      - name: Display logs
        if: always()
        run: docker compose logs

      # 8. Arreter et supprimer les conteneurs de test
      - name: Stop containers
        if: always()
        run: docker compose down -v
